    </defs><g clip-path="url(#bounds)"><rect x="0" y="0" width="1200" height="380" rx="24" fill="url(#back)" stroke="none" /><rect x="0" y="0" width="1200" height="380" rx="24" fill="url(#back)" stroke="none" /><path d="M603 34L603 346" stroke="#2b3650" stroke-width="1" fill="none" /><text x="34" y="45" fill="#55b5ff" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="500" letter-spacing="1">01 / THE BIG PICTURE</text><text x="34" y="98" fill="#f1f5ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" >System design</text><text x="34" y="130" fill="#a1adc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >Understand the trade-offs behind the code.</text><rect x="36" y="174" width="154" height="64" rx="12" fill="#101d31" stroke="#334763" /><circle cx="56" cy="194" r="3" fill="#55b5ff" /><text x="54" y="218" fill="#55b5ff" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="500" >REQUEST</text><rect x="221" y="174" width="154" height="64" rx="12" fill="#101d31" stroke="#334763" /><circle cx="241" cy="194" r="3" fill="#b49bff" /><text x="239" y="218" fill="#b49bff" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="500" >SERVICE</text><rect x="406" y="174" width="154" height="64" rx="12" fill="#101d31" stroke="#334763" /><circle cx="426" cy="194" r="3" fill="#73e2bf" /><text x="424" y="218" fill="#73e2bf" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="500" >DATA</text><path d="M190 206L221 206" stroke="#55b5ff" stroke-width="2" fill="none" /><path d="M375 206L406 206" stroke="#b49bff" stroke-width="2" fill="none" /><path d="M298 238V265H483V238" fill="none" stroke="#405671" stroke-dasharray="4 5"/><text x="34" y="302" fill="#55b5ff" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="500" >CONSTRAINTS  /  DATA  /  FAILURE MODES</text><text x="34" y="335" fill="#a1adc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >Sketch it. Question it. Build a small version.</text><text x="638" y="45" fill="#ffad74" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="500" letter-spacing="1">02 / CLOSER TO THE METAL</text><text x="638" y="98" fill="#f1f5ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" >Learning Rust</text><text x="638" y="130" fill="#a1adc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >A new way to think about safety and control.</text><rect x="638" y="166" width="528" height="107" rx="12" fill="#0b1222" stroke="#314056" /><circle cx="656" cy="184" r="3" fill="#ff897c" /><circle cx="669" cy="184" r="3" fill="#f7ca78" /><circle cx="682" cy="184" r="3" fill="#7ed6b1" /><text x="657" y="216" fill="#b49bff" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="500" >fn</text><text x="688" y="216" fill="#d2dced" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="400" >main() {</text><text x="681" y="244" fill="#ffad74" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" >// ownership → borrowing → lifetimes</text><text x="657" y="264" fill="#d2dced" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" >}</text><text x="638" y="302" fill="#ffad74" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="500" >OWNERSHIP  /  TRAITS  /  CONCURRENCY</text><text x="638" y="335" fill="#a1adc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >Learning the fundamentals, one program at a time.</text></g><rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#2b3650" /></svg>